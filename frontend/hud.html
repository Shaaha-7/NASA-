<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarsPath - Helmet HUD</title>
<style>
:root{--hud:#fff4e6;--amber:#ffb15c;--ok:#5eea8c;--bad:#ff6b5e;--dim:rgba(255,244,230,.62);--glow:0 0 6px rgba(255,177,92,.65),0 0 1px rgba(0,0,0,.9)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050302;color:var(--hud);font:14px/1.3 "Segoe UI",system-ui,Roboto,Arial,sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.6) contrast(1.08);transition:opacity .5s}
#bg.hidden{opacity:0}
/* helmet visor: curved dark rim, faint gold tint, reflection */
.visor{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 78% 74% at 50% 46%,rgba(255,170,60,.06) 0%,rgba(255,170,60,.05) 55%,rgba(10,6,3,.55) 78%,rgba(5,3,2,.97) 92%);}
.visor::after{content:"";position:absolute;left:-10%;top:-30%;width:70%;height:70%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.10),transparent);transform:rotate(-20deg)}
.hud{position:fixed;inset:0;pointer-events:none;text-shadow:var(--glow)}
.hud *{pointer-events:auto}
.pane,.tape,.hdg,.ahead{background:rgba(8,5,3,.58);border:1px solid rgba(255,177,92,.32);border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:inset 0 0 18px rgba(255,150,60,.08)}
.pane{padding:10px 14px}.pane+.pane{margin-top:10px}
.hdg{padding:3px 12px}.ahead{padding:6px 12px}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.big{font-size:30px;font-weight:300;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.mid{font-size:18px;font-weight:400;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.bad{color:var(--bad)}.am{color:var(--amber)}
/* compass tape */
.tape{position:absolute;left:50%;top:5.5%;width:min(560px,60vw);height:44px;transform:translateX(-50%);overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.tape svg{position:absolute;top:0;height:44px}
.tapeptr{position:absolute;left:50%;top:5.5%;transform:translate(-50%,40px);width:0;height:0;border:7px solid transparent;border-bottom:10px solid var(--hud);filter:drop-shadow(0 0 3px rgba(255,177,92,.8))}
.hdg{position:absolute;left:50%;top:calc(5.5% + 58px);transform:translateX(-50%);text-align:center}
/* corner clusters */
.tl{position:absolute;left:12%;top:16%}
.tr{position:absolute;right:12%;top:16%;text-align:right}
.bl{position:absolute;left:12%;bottom:19%}
.br{position:absolute;right:11%;bottom:17%;text-align:right}
.ring{width:118px;height:118px}
.stack>div{margin-bottom:0}
/* reticle */
.ret{position:absolute;left:50%;top:50%;width:120px;height:120px;transform:translate(-50%,-50%);opacity:.8}
.ahead{position:absolute;left:50%;top:calc(50% + 78px);transform:translateX(-50%);text-align:center;min-width:260px}
.warn{position:absolute;left:50%;top:22%;transform:translateX(-50%);padding:6px 14px;border:1px solid var(--bad);border-radius:6px;background:rgba(60,8,4,.45);color:#ffd5cf;max-width:48vw;text-align:center}
.warn.hidden{display:none}
/* bottom: simulation scrubber */
.ctl{position:absolute;left:50%;bottom:4.5%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;width:min(640px,72vw);
  background:rgba(10,6,3,.55);border:1px solid rgba(255,177,92,.35);border-radius:999px;padding:6px 14px;text-shadow:none}
.ctl input{flex:1;accent-color:var(--amber)}
.ctl button{background:none;border:1px solid rgba(255,177,92,.6);color:var(--hud);border-radius:50%;width:30px;height:30px;cursor:pointer}
.sim{position:absolute;left:50%;bottom:calc(4.5% + 48px);transform:translateX(-50%);font-size:11px;color:var(--hud);letter-spacing:.08em;white-space:nowrap;background:rgba(8,5,3,.6);padding:2px 10px;border-radius:999px}
.back{position:absolute;left:18px;top:14px;color:var(--hud);text-decoration:none;font-size:13px;opacity:.85}
.credit{position:absolute;right:18px;bottom:10px;font-size:10.5px;color:var(--hud);text-shadow:0 0 3px #000}
.msg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:16px;text-align:center;max-width:60vw}
@media(max-width:820px){.tl,.bl{left:6%}.tr,.br{right:6%}.big{font-size:22px}.ring{width:84px;height:84px}.minimap{width:130px;height:96px}}
</style>
</head>
<body>
<img id="bg" class="hidden" alt="">
<div class="visor"></div>
<div class="hud">
  <a class="back" href="dashboard.html">‹ Mission dashboard</a>
  <div class="tape" id="tape"></div><div class="tapeptr"></div>
  <div class="hdg"><span class="mid" id="hdg">---°</span> <span class="lbl" id="hdgTxt">heading</span></div>

  <div class="tl stack">
    <div class="pane"><div class="lbl">EVA time left</div><svg class="ring" id="ring" viewBox="0 0 120 120"></svg></div>
    <div class="pane"><div class="lbl">Crew</div><div class="mid" id="crew">-</div></div>
  </div>

  <div class="tr stack">
    <div class="pane"><div class="lbl">Next stop</div><div class="mid am" id="nextName">-</div></div>
    <div class="pane"><div class="lbl">Distance · ETA</div><div class="big" id="nextDist">-</div><div class="mid" id="nextEta">-</div></div>
  </div>

  <svg class="ret" viewBox="0 0 120 120" aria-hidden="true"><g fill="none" stroke="#fff4e6" stroke-width="1.4"><circle cx="60" cy="60" r="22" stroke-dasharray="4 6"/><path d="M60 22v16M60 82v16M22 60h16M82 60h16"/></g></svg>
  <div class="ahead"><div class="lbl">Grade ahead (next 100 m)</div><div class="mid" id="ahead">-</div></div>
  <div class="warn hidden" id="warn"></div>

  <div class="bl stack">
    <div class="pane"><div class="lbl">Walk home from here</div><div class="big" id="home">-</div><div class="mid" id="homeMargin">-</div></div>
    <div class="pane"><div class="lbl">Elevation · terrain</div><div class="mid" id="elev">-</div></div>
    <div class="pane"><div class="lbl">Space weather</div><div class="mid" id="sw">-</div></div>
  </div>

  <div class="br pane"><div class="lbl">Route</div><svg class="minimap" id="mini" width="190" height="140" viewBox="0 0 190 140"></svg>
    <div class="mid" id="prog">-</div></div>

  <div class="sim" id="simTxt">SIMULATION · position along the planned route is not live</div>
  <div class="ctl"><button id="play" aria-label="Play">▶</button><input id="pos" type="range" min="0" max="1000" value="0" aria-label="Position along route"><span id="posTxt" style="min-width:64px;text-align:right">0.0 km</span></div>
  <div class="msg" id="msg">Loading route...</div>
  <div class="credit" id="credit"></div>
</div>
<script>
const API = "/api/v1", $ = (id) => document.getElementById(id), Q = new URLSearchParams(location.search);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hm = (m) => (m == null || !isFinite(m) ? "n/a" : `${Math.floor(m / 60)}:${String(Math.round(m % 60)).padStart(2, "0")}`);
const get = async (p, o) => { const r = await fetch(API + p, { headers: { "Content-Type": "application/json" }, ...o }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j?.detail?.message || "Request failed"); return j; };
const H = { route: null, prof: [], pos: 0, playing: false, imgAt: null };

function bearing(a, b) { // initial bearing on a sphere, degrees from north, east positive
  const r = Math.PI / 180, p1 = a.lat * r, p2 = b.lat * r, dl = (b.lon - a.lon) * r;
  return (Math.atan2(Math.sin(dl) * Math.cos(p2), Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl)) / r + 360) % 360;
}
function at(km) { // interpolate the route profile at a distance
  const p = H.prof, last = p.length - 1;
  if (km >= p[last].distance_km) return { ...p[last], i: last };   // end of route (also guards rounding)
  let i = p.findIndex((d) => d.distance_km >= km); if (i <= 0) return { ...p[0], i: 0 };
  const a = p[i - 1], b = p[i], t = (km - a.distance_km) / ((b.distance_km - a.distance_km) || 1), L = (k) => a[k] + (b[k] - a[k]) * t;
  return { distance_km: km, lon: L("lon"), lat: L("lat"), elevation_m: L("elevation_m"), eta_min: L("eta_min"), walk_home_min: L("walk_home_min"), grade_deg: b.grade_deg, i };
}
function drawTape(h) {
  const pxDeg = 4, w = 360 * pxDeg * 3, ticks = [];
  for (let d = -360; d <= 720; d += 5) {
    const x = (d + 360) * pxDeg, n = ((d % 360) + 360) % 360, card = { 0: "N", 90: "E", 180: "S", 270: "W" }[n];
    ticks.push(`<line x1="${x}" x2="${x}" y1="${n % 15 ? 30 : 22}" y2="40" stroke="#fff4e6" stroke-width="${n % 15 ? 1 : 1.6}"/>`);
    if (!(n % 15)) ticks.push(`<text x="${x}" y="16" text-anchor="middle" fill="${card ? "#ffb15c" : "#fff4e6"}" font-size="${card ? 15 : 11}" font-weight="${card ? 700 : 400}">${card || n}</text>`);
  }
  const host = $("tape"), off = host.clientWidth / 2 - (h + 360) * pxDeg;
  host.innerHTML = `<svg width="${w}" viewBox="0 0 ${w} 44" style="left:${off}px">${ticks.join("")}${H.nextBrg != null ? `<path d="M${(H.nextBrg + 360) * pxDeg - 7} 42 l7 -9 l7 9 z" fill="#ffb15c"/>` : ""}</svg>`;
}
function ring(left, usable) {
  const f = Math.max(0, Math.min(1, left / usable)), R = 50, C = 2 * Math.PI * R, col = f > 0.35 ? "#5eea8c" : f > 0.15 ? "#ffb15c" : "#ff6b5e";
  $("ring").innerHTML = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="rgba(255,244,230,.18)" stroke-width="7"/>
    <circle cx="60" cy="60" r="${R}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C * f} ${C}" transform="rotate(-90 60 60)"/>
    <text x="60" y="64" text-anchor="middle" fill="#fff4e6" font-size="22" font-weight="300">${hm(left)}</text><text x="60" y="82" text-anchor="middle" fill="rgba(255,244,230,.6)" font-size="10">h:mm usable</text>`;
}
function drawMini(km) {
  const c = H.route.geometry.coordinates, xs = c.map((p) => p[0]), ys = c.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), s = Math.min(170 / ((x1 - x0) || 1e-9), 120 / ((y1 - y0) || 1e-9));
  const X = (lon) => 10 + (lon - x0) * s, Y = (lat) => 10 + (y1 - lat) * s, me = at(km);
  const stops = H.route.stops.map((st, i) => `<circle cx="${X(st.snapped[0])}" cy="${Y(st.snapped[1])}" r="${i === 0 || i === H.route.stops.length - 1 ? 4 : 3}" fill="${i === 0 ? "#5eea8c" : "#ffb15c"}"/>`).join("");
  $("mini").innerHTML = `<polyline points="${c.map((p) => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ")}" fill="none" stroke="rgba(255,244,230,.85)" stroke-width="1.6" stroke-dasharray="4 3"/>${stops}
    <circle cx="${X(me.lon)}" cy="${Y(me.lat)}" r="5.5" fill="#fff4e6" stroke="#ffb15c" stroke-width="2"><animate attributeName="r" values="5;7;5" dur="1.6s" repeatCount="indefinite"/></circle>`;
}
// Mean brightness of a same-origin image (skip near-black frames such as solar-filter images).
function bright(u) { return new Promise((res) => { const im = new Image(); im.onload = () => { try { const c = document.createElement("canvas"); c.width = c.height = 24; const g = c.getContext("2d"); g.drawImage(im, 0, 0, 24, 24); const d = g.getImageData(0, 0, 24, 24).data; let s = 0; for (let k = 0; k < d.length; k += 4) s += 0.2126 * d[k] + 0.7152 * d[k + 1] + 0.0722 * d[k + 2]; res(s / (d.length / 4) / 255); } catch { res(null); } }; im.onerror = () => res(null); im.src = u; }); }
async function groundView(p) {
  if (H.imgAt && Math.abs(H.imgAt - p.distance_km) < 0.4) return;
  H.imgAt = p.distance_km;
  try {
    const d = await get(`/ground-view?region_id=${encodeURIComponent(H.region)}&lon=${p.lon}&lat=${p.lat}&max_images=8`);
    const imgs = (d.images || []).map((x) => ({ u: x.local_medium_url || (d.offline ? null : x.medium_url), sol: x.sol, cam: x.camera_label || x.camera })).filter((x) => x.u);
    for (const x of imgs) { const b = await bright(x.u); if (b === null || b >= 0.18) { $("bg").src = x.u; $("bg").classList.remove("hidden");
      $("credit").textContent = `${x.cam} · sol ${x.sol} · NASA/JPL-Caltech · nearest Perseverance stop ${d.rover_stop?.distance_m != null ? Math.round(d.rover_stop.distance_m) + " m away" : ""}`; return; } }
  } catch { /* keep previous image */ }
}
function render() {
  const r = H.route, total = H.prof[H.prof.length - 1].distance_km, km = (H.pos / 1000) * total, p = at(km), usable = r.eva.usable_min;
  $("posTxt").textContent = km.toFixed(2) + " km";
  // heading: direction of travel over the next ~60 m
  const q = at(Math.min(total, km + 0.06)), pr = at(Math.max(0, km - 0.06)), hdg = bearing(pr, q);
  const nxt = r.stops.find((s) => s.at_distance_km > km + 0.005) || r.stops[r.stops.length - 1];
  H.nextBrg = bearing(p, { lon: nxt.snapped[0], lat: nxt.snapped[1] });
  drawTape(hdg); $("hdg").textContent = Math.round(hdg).toString().padStart(3, "0") + "°";
  $("hdgTxt").textContent = `next stop bearing ${Math.round(H.nextBrg)}°`;
  const elapsed = p.eta_min, left = usable - elapsed - (r.eva.round_trip ? 0 : 0);
  ring(left, usable);
  $("crew").textContent = `${r.eva_params.crew_size} · ${r.eva_params.derived.load_per_person_kg} kg each`;
  const arrived = km >= total - 0.005;
  $("nextName").textContent = arrived ? `Arrived: ${nxt.name}` : nxt.name;
  $("nextDist").textContent = `${Math.max(0, nxt.at_distance_km - km).toFixed(2)} km`;
  $("nextEta").textContent = `${hm(Math.max(0, nxt.eta_min - elapsed))} h:mm walking`;
  // grade ahead: steepest grade in the next 100 m of the profile
  const ahead = H.prof.filter((d) => d.distance_km > km && d.distance_km <= km + 0.1), g = ahead.length ? Math.max(...ahead.map((d) => d.grade_deg)) : p.grade_deg;
  const lim = r.eva_params.caution_slope_deg;
  $("ahead").innerHTML = `<span class="${g > lim ? "bad" : g > lim * 0.66 ? "am" : "ok"}">${g.toFixed(1)}°</span> <span class="lbl">caution above ${lim}°</span>`;
  const home = p.walk_home_min, margin = left - home;
  $("home").textContent = `${hm(home)}`;
  $("homeMargin").innerHTML = `<span class="${margin >= 0 ? "ok" : "bad"}">${margin >= 0 ? "+" + hm(margin) + " spare" : hm(-margin) + " short"}</span> <span class="lbl">vs EVA time left</span>`;
  $("elev").textContent = `${Math.round(p.elevation_m).toLocaleString("en-US").replace("-", "−")} m · ${p.grade_deg.toFixed(1)}° here`;
  const w = r.warnings.find((x) => x.at_distance_km >= km - 0.02 && x.at_distance_km - km < 0.25 && x.rule_id !== "R5_EVA_BUDGET");
  $("warn").classList.toggle("hidden", !w);
  if (w) $("warn").innerHTML = `⚠ <b>${esc(w.title)}</b> in ${Math.max(0, Math.round((w.at_distance_km - km) * 1000))} m`;
  $("prog").textContent = `${km.toFixed(2)} / ${total.toFixed(2)} km`;
  drawMini(km);
  groundView(p);
}
$("pos").oninput = () => { H.pos = +$("pos").value; render(); };
$("play").onclick = () => { H.playing = !H.playing; $("play").textContent = H.playing ? "❚❚" : "▶"; if (H.playing) tick(); };
function tick() { if (!H.playing) return; H.pos = Math.min(1000, H.pos + 2); $("pos").value = H.pos; render(); if (H.pos >= 1000) { H.playing = false; $("play").textContent = "▶"; return; } setTimeout(tick, 120); }
document.addEventListener("keydown", (e) => { if (e.key === "ArrowRight" || e.key === "ArrowLeft") { H.pos = Math.max(0, Math.min(1000, H.pos + (e.key === "ArrowRight" ? 10 : -10))); $("pos").value = H.pos; render(); } });

(async function init() {
  try {
    let body = null; try { body = JSON.parse(localStorage.getItem("marspath.plan") || "null"); } catch { body = null; }
    if (!body) { // no plan from the dashboard yet: landing site to the depot, like the dashboard's default
      const regs = await get("/regions"), reg = (regs.regions || []).find((r) => !r.is_test_fixture) || regs.regions[0];
      const ss = await get(`/science-sites?region_id=${encodeURIComponent(reg.region_id)}`), f = (ss.features || []).filter((x) => x.properties.kind === "science_site");
      const a = f.find((x) => /landing/i.test(x.properties.name)) || f[0], b = f.find((x) => /depot/i.test(x.properties.name)) || f[f.length - 1];
      body = { region_id: reg.region_id, start: { lon: a.geometry.coordinates[0], lat: a.geometry.coordinates[1], name: "Landing Site" }, destination: { lon: b.geometry.coordinates[0], lat: b.geometry.coordinates[1], name: "Depot" }, stops: [], optimise_stop_order: true, eva: {} };
    }
    H.region = body.region_id;
    H.route = await get("/routes/calculate", { method: "POST", body: JSON.stringify({ ...body, profile: "gentlest" }) });
    H.prof = H.route.elevation_profile;
    const sw = H.route.space_weather?.advisory?.level;
    $("sw").innerHTML = sw ? `<span class="${sw === "nominal" ? "ok" : "am"}">${sw === "nominal" ? "Nominal" : "Caution"}</span> <span class="lbl">DONKI</span>` : "n/a";
    $("msg").remove(); render();
  } catch (e) { $("msg").textContent = "Could not load a route: " + e.message; }
})();
</script>
</body>
</html>
